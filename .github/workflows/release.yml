name: Publish versioned release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test the tagged source
        run: npm test
      - name: Build the downloadable package
        run: npm run package:release -- "$GITHUB_REF_NAME"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/*.zip \
            release/*.sha256 \
            --verify-tag \
            --generate-notes \
            --title "Ellivien OpenAI Companion Portal $GITHUB_REF_NAME"
